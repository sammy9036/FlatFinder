# ============================================
# DATABASE CONFIGURATION
# Railway deployment mode: use Railway-provided env vars.
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:flatfinder}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ============================================
# JSP CONFIGURATION
# ============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Allow JSP files to be accessed
spring.resources.static-locations=classpath:/static/,file:src/main/webapp/

# ============================================
# EMAIL CONFIGURATION (Gmail SMTP)
# ============================================

# ============================================
# SESSION CONFIGURATION
# ============================================
server.servlet.session.timeout=30m

# ============================================
# APPLICATION INFO
# ============================================
spring.application.name=FlatFinder
app.name=FlatFinder
app.description=Broker-free room rental platform

# ============================================
# STATIC RESOURCES CONFIGURATION
# ============================================
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/
spring.resources.chain.cache=true
spring.resources.chain.gzip=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Upload directory - images stored here
app.upload.dir=src/main/webapp/uploads/properties
