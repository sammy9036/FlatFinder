# ============================================
# DATABASE CONFIGURATION
# Railway deployment mode: use Railway-provided env vars.
# ============================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:flatfinder}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ============================================
# JSP CONFIGURATION
# ============================================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
# Allow JSP files to be accessed
spring.resources.static-locations=classpath:/static/,file:src/main/webapp/

# ============================================
# EMAIL CONFIGURATION (Gmail SMTP)
# Set these variables in Railway for email functionality:
# SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD
# or use env vars: MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD
# ============================================
spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}
spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Support email address (used for contact form)
app.support.email=${APP_SUPPORT_EMAIL:${spring.mail.username}}

# ============================================
# SESSION CONFIGURATION
# ============================================
server.servlet.session.timeout=30m

# ============================================
# APPLICATION INFO
# ============================================
spring.application.name=FlatFinder
app.name=FlatFinder
app.description=Broker-free room rental platform

# ============================================
# STATIC RESOURCES CONFIGURATION
# ============================================
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/
spring.resources.chain.cache=true
spring.resources.chain.gzip=true

# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# Upload directory - images stored here
app.upload.dir=src/main/webapp/uploads/properties
