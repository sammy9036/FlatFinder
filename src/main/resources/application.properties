# ============================================
# DATABASE CONFIGURATION
# ============================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:flatfinder}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Avoid database access during JSP rendering
spring.jpa.open-in-view=false


# ============================================
# SERVER CONFIGURATION
# ============================================

server.port=${PORT:8080}
server.servlet.context-path=/

server.servlet.session.timeout=30m


# ============================================
# JSP CONFIGURATION
# ============================================

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp


# ============================================
# STATIC RESOURCES
# ============================================

spring.web.resources.static-locations=classpath:/static/


# ============================================
# EMAIL CONFIGURATION
# ============================================

spring.mail.host=${SPRING_MAIL_HOST:${MAIL_HOST:smtp.gmail.com}}
spring.mail.port=${SPRING_MAIL_PORT:${MAIL_PORT:587}}

spring.mail.username=${SPRING_MAIL_USERNAME:${MAIL_USERNAME:}}
spring.mail.password=${SPRING_MAIL_PASSWORD:${MAIL_PASSWORD:}}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.support.email=${APP_SUPPORT_EMAIL:${spring.mail.username}}


# ============================================
# APPLICATION INFO
# ============================================

spring.application.name=FlatFinder

app.name=FlatFinder
app.description=Broker-free room rental platform


# ============================================
# FILE UPLOAD CONFIGURATION
# ============================================

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Must match a persistent volume mount in Railway
app.upload.dir=${APP_UPLOAD_DIR:/app/uploads/properties}
